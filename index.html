<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Öva på DAG:ar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#172f32;font:16px/1.5 system-ui,sans-serif}header{background:#193b3b;color:#fff;padding:17px max(5vw,24px);display:flex;align-items:center;gap:12px;font-weight:650}header svg{width:38px}main{max-width:1120px;margin:auto;padding:36px 24px}h1,h2{font-family:Georgia,serif;font-weight:normal;line-height:1.12}h1{font-size:clamp(40px,6vw,70px);margin:0}h2{font-size:32px;margin:14px 0 22px}p{max-width:68ch}nav{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #9aa9a3;border-radius:6px;background:#fff;padding:10px 14px}nav button{border-radius:24px}button:hover,button:focus-visible{outline:2px solid #458477;outline-offset:2px}nav [aria-current=true],.next{background:#193b3b;color:white}article{display:grid;grid-template-columns:1fr 1fr;border:1px solid #bdc8bc;border-radius:12px;overflow:hidden;background:white}.panel,section{padding:clamp(20px,3vw,37px)}.panel{display:flex;flex-direction:column;background-color:#e6eee4;background-image:radial-gradient(#becbbb .9px,transparent .9px);background-size:16px 16px}.graph{width:100%;margin:auto;min-height:210px}small{font:600 12px/1.5 monospace;text-transform:uppercase;letter-spacing:.1em}.choice{display:flex;align-items:baseline;gap:12px;text-align:left;width:100%;margin-bottom:9px}.choice b{font:600 12px monospace;color:#476b61}.choice:disabled{cursor:default;color:#344846}.right{background:#dceedd;border-color:#3a7451}.wrong{background:#fae8df;border-color:#a76a50}.feedback{margin-top:14px}.feedback p{margin:5px 0 18px}details{font-size:14px}summary{cursor:pointer}.next{padding-inline:20px}@media(max-width:700px){article{grid-template-columns:1fr}.graph{max-height:210px;min-height:0}main{padding:24px 14px}}
</style>
<header><svg viewBox="0 0 40 30" aria-hidden="true"><path d="M6 22L20 7 34 22" stroke="#b6dfaa" fill="none" stroke-width="2"/><g fill="#b6dfaa"><circle cx="6" cy="22" r="4"/><circle cx="20" cy="7" r="4"/><circle cx="34" cy="22" r="4"/></g></svg>Kausal inferens</header>
<main><h1>Öva på DAG:ar</h1><p>En riktad acyklisk graf (DAG) visar vilka orsakssamband vi antar i en övning. Läs diagrammet och välj ett svar. Följ sedan pilarna i förklaringen.</p>
<nav aria-label="Svårighetsgrad"></nav><div id="exercise"></div></main>
<script>
const levels=['Grundnivå','Mellannivå','Avancerad nivå'];
const positions={
 pair:[[110,110],[310,110]],
 chain:[[48,110],[210,110],[372,110]],
 triangle:[[60,160],[210,55],[360,160]],
 diamond:[[48,112],[210,45],[372,112],[210,185]],
 proxy:[[55,180],[210,60],[365,180],[210,200]],
 branch:[[60,45],[210,115],[360,45],[210,210]]
};
// Edge pairs index the nodes in the order given by labels.
const lessons=[
 ["pair",["Regn","Markfuktighet"],[[0,1]],"Vad betyder pilen från regn till markfuktighet?",["Markfuktigheten påverkar om det regnar.","Regn påverkar markfuktigheten direkt i modellen.","Marken blir alltid blöt när det regnar."],1,"Pilen går från den antagna orsaken till det som påverkas. Här visar den att regn påverkar markfuktigheten. Hur mycket fuktigare marken blir framgår inte av pilen."],
 ["chain",["Övning","Färdighet","Resultat"],[[0,1],[1,2]],"Hur påverkar övning resultatet enligt diagrammet?",["Genom att övningen påverkar färdigheten.","Genom en direkt pil till resultatet.","Genom en gemensam orsak till övning och resultat."],0,"Följ pilarna från övning via färdighet till resultat. Färdighet är en mediator, alltså ett mellanled som förmedlar effekten av övning."],
 ["triangle",["Glassköp","Värme","Badbesök"],[[1,0],[1,2]],"Dagar då fler köper glass är det också fler som badar. Hur förklarar diagrammet sambandet?",["Fler badbesök leder till fler glassköp.","Fler glassköp leder till fler badbesök.","Värmen påverkar både glassköp och badbesök."],2,"Båda pilarna utgår från värme. När det är varmt köper fler glass och fler går och badar. Det kan ge ett samband mellan glassköp och badbesök även utan en pil mellan dem."],
 ["triangle",["Regn","Blöt stig","Bevattning"],[[0,1],[2,1]],"Vilken roll har den blöta stigen på vägen mellan regn och bevattning?",["Gemensam orsak","Kolliderare (gemensam effekt)","Mediator"],1,"Båda pilspetsarna pekar mot den blöta stigen. Där möts två orsaker i en gemensam effekt, en kolliderare. Vägen är stängd, men om vi bara studerar tillfällen då stigen är blöt öppnar vi den."],
 ["triangle",["Övning","Motivation","Resultat"],[[1,0],[1,2],[0,2]],"Vad bör du justera för om du vill skatta den totala effekten av övning på resultatet?",["Motivation","Resultat","Ingen av variablerna"],0,"Motivation påverkar både hur mycket en person övar och vilket resultat personen får. Motivation är därför en confounder. Genom att jämföra personer med samma motivation stänger du vägen Övning ← Motivation → Resultat. Den direkta pilen från övning till resultat finns kvar.",{"after":[1]}],
 ["branch",["Betyg","Antagning","Idrottsmeriter","Kursstart"],[[0,1],[2,1],[1,3]],"En skola antar elever som har höga betyg eller starka idrottsmeriter. Bland alla sökande finns inget samband mellan betyg och idrottsmeriter. Varför kan vi ändå se ett samband när vi bara tittar på eleverna som började på skolan?",["Höga betyg gör att eleverna blir bättre på idrott.","Skolstarten påverkar de betyg eleverna hade när de sökte.","Elever med lägre betyg behövde starka idrottsmeriter för att komma in."],2,"Tänk på en elev som började på skolan trots lägre betyg. Vi vet att eleven kom in, så enligt antagningsregeln måste eleven ha haft starka idrottsmeriter. För en elev med höga betyg kunde idrottsmeriterna däremot vara vilka som helst. På så sätt skapar urvalet ett samband. I diagrammet möts pilarna vid Antagning. Fyrkanten runt Kursstart visar att vi bara tittar på dem som sedan började.",{"given":[3]}],
 ["diamond",["Övning","Färdighet","Resultat","Motivation"],[[0,1],[1,2],[3,0],[3,2]],"Vad bör du justera för om du vill få med hela effekten av övning på resultatet?",["Både färdighet och motivation.","Enbart motivation.","Enbart färdighet."],1,"Justering för motivation stänger vägen Övning ← Motivation → Resultat. Färdighet är en mediator. Om du även justerar för färdighet stänger du den väg som förmedlar effekten av övning i diagrammet.",{"after":[3]}],
 ["diamond",["Stödkurs","Enkätsvar","Provpoäng","Förkunskaper"],[[0,1],[2,1],[3,0],[3,2],[0,2]],"Du vill veta hur en stödkurs påverkar provpoängen. Du jämför elever med samma förkunskaper. Både kursdeltagande och provpoäng påverkar vilka som svarar på en enkät efter provet. Vad händer om du bara analyserar elever som svarade?",["Jämförelsen blir rättvis eftersom alla i analysen har svarat.","Urvalet tar bort kursens effekt på provpoängen.","Urvalet kan få kursens effekt att se större eller mindre ut än den är."],2,"När du jämför elever med samma förkunskaper stänger du vägen Stödkurs ← Förkunskaper → Provpoäng. Tänk dig nu att kursdeltagare ofta svarar på enkäten oavsett resultat, medan andra elever främst svarar när de fått höga poäng. Bland dem som svarade skulle gruppen utan stödkurs då innehålla ovanligt många högpresterande elever. Det är så urvalet öppnar vägen Stödkurs → Enkätsvar ← Provpoäng. Diagrammet visar att skattningen kan bli sned. Åt vilket håll beror på vilka som svarar.",{"given":[1,3]}],
 ["proxy",["Läxhjälp","Förkunskaper","Provpoäng","Förtest"],[[1,0],[1,2],[1,3]],"Elevers förkunskaper påverkar både vilka som får läxhjälp och hur de klarar slutprovet. Du har bara ett kort förtest som mäter förkunskaperna ungefärligt. Om du jämför elever med samma poäng på förtestet, kan deras förkunskaper fortfarande påverka jämförelsen?",["Ja, elever med samma poäng kan ha olika förkunskaper.","Nej, samma poäng betyder att eleverna har samma förkunskaper.","Nej, det räcker att förtestet gjordes före läxhjälpen."],0,"Två elever kan båda få 7 av 10 på förtestet, trots att den ena kan mer än den andra. Om eleven med svagare förkunskaper oftare får läxhjälp kan grupperna därför skilja sig åt redan från början. Följ vägen Läxhjälp ← Förkunskaper → Provpoäng. Fyrkanten ligger på förtestet, som är en grov markör för förkunskaperna och ligger på en egen gren. Att justera för förtestet kan minska skillnaden mellan grupperna, men vägen via förkunskaper är fortfarande öppen.",{"given":[3]}]
];
const host=document.querySelector('#exercise'),nav=document.querySelector('nav');
let current=0,answers=[];
function diagram(layout,labels,edges,conditioned){
 const points=positions[layout],radius=25;
 const lines=edges.map(([a,b])=>{
  const [x,y]=points[a],[u,v]=points[b],length=Math.hypot(u-x,v-y),dx=(u-x)/length,dy=(v-y)/length;
  const squareRadius=radius/Math.max(Math.abs(dx),Math.abs(dy));
  const start=conditioned.includes(a)?squareRadius:radius;
  const end=(conditioned.includes(b)?squareRadius:radius)+4;
  return '<line x1="'+(x+dx*start)+'" y1="'+(y+dy*start)+'" x2="'+(u-dx*end)+'" y2="'+(v-dy*end)+'" stroke="#48665e" stroke-width="2.4" marker-end="url(#arrow)"/>';
 }).join('');
 const nodes=points.map(([x,y],i)=>'<g transform="translate('+x+' '+y+')">'+(conditioned.includes(i)?'<rect x="-25" y="-25" width="50" height="50" fill="#fff3cf" stroke="#71531c" stroke-width="3"/>':'<circle r="25" fill="#f9fcf1" stroke="#48665e" stroke-width="2"/>')+'<text text-anchor="middle" y="8" font-family="Georgia" font-style="italic" font-size="24">'+String.fromCharCode(65+i)+'</text><text y="46" text-anchor="middle" font-size="14" font-weight="650" stroke="#e6eee4" stroke-width="4" paint-order="stroke">'+labels[i]+'</text></g>').join('');
 const legend=conditioned.length?'Fyrkant = variabel som vi konditionerar på.':'';
 const names=conditioned.map(i=>labels[i]).join(', ');
 const description=edges.map(([a,b])=>labels[a]+' → '+labels[b]).join(', ')+(names?'. Vi konditionerar på '+names+'.':'');
 return '<svg role="img" aria-label="'+description+'" class="graph" viewBox="0 0 420 275"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#48665e"/></marker></defs>'+lines+nodes+'</svg>'+(legend?'<p>'+legend+'</p>':'')+'<details><summary>Visa diagrammet som text</summary>'+description+'</details>';
}
function render(){
 const [layout,labels,edges,question,choices,key,why,conditioning={}]=lessons[current],level=Math.floor(current/3);
 const conditioned=conditioning.given ?? (answers[current]!==undefined?conditioning.after:[]) ?? [];
 [...nav.children].forEach((button,i)=>button.setAttribute('aria-current',String(i===level)));
 host.innerHTML='<article><div class="panel"><small>Orsaksdiagram · '+String(current+1).padStart(2,'0')+'</small>'+diagram(layout,labels,edges,conditioned)+'</div><section><small>'+levels[level]+' · '+(current%3+1)+' av 3</small><h2 tabindex="-1">'+question+'</h2><div id="choices"></div><div class="feedback" role="status"></div></section></article>';
 const chosen=answers[current];
 choices.forEach((choice,i)=>{
  const button=document.createElement('button');button.className='choice';button.innerHTML='<b>'+String.fromCharCode(65+i)+'</b>'+choice;
  if(chosen!==undefined){button.disabled=true;if(i===key)button.classList.add('right');else if(i===chosen)button.classList.add('wrong')}
  button.onclick=()=>{answers[current]=i;render();host.querySelector('.next').focus()};host.querySelector('#choices').append(button);
 });
 if(chosen!==undefined){
  host.querySelector('.feedback').innerHTML='<strong>'+(chosen===key?'Rätt!':'Rätt svar är '+choices[key])+'</strong><p>'+why+'</p><button class="next">'+(current===8?'Visa resultat':'Nästa diagram →')+'</button>';
  host.querySelector('.next').onclick=()=>{if(current<8)go(current+1);else finish()};
 }
}
function go(index){current=index;render();host.querySelector('h2').focus()}
function finish(){
 const completed=answers.filter(Number.isInteger).length,score=answers.filter((answer,i)=>answer===lessons[i][5]).length;
 host.innerHTML='<section><h2 tabindex="-1">Ditt resultat</h2><p>Du besvarade '+completed+' av 9 frågor och fick '+score+' rätt.</p><button class="next">Börja om</button></section>';
 host.querySelector('h2').focus();host.querySelector('button').onclick=()=>{answers=[];go(0)};
}
levels.forEach((name,i)=>{const button=document.createElement('button');button.textContent=name;button.onclick=()=>go(i*3);nav.append(button)});
render();
</script></html>
